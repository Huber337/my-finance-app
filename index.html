<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый Менеджер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --green: #22c55e;
      --red: #ef4444; --blue: #38bdf8; --purple: #a855f7;
      --text: #f8fafc; --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, sans-serif; background: var(--bg);
      color: var(--text); padding: 12px; margin: 0; padding-bottom: 70px;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 16px;
      margin-bottom: 12px; border: 1px solid #334155;
    }
    .balance-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .balance-val { font-size: 28px; font-weight: 800; color: var(--blue); margin: 4px 0; }
    .stats-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; }
    .inc { color: var(--green); } .exp { color: var(--red); }
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .cat-btn {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 10px 4px; color: #fff; text-align: center; font-size: 11px; cursor: pointer;
    }
    input {
      width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box;
    }
    button.main-btn {
      width: 100%; padding: 10px; border-radius: 8px; border: none;
      font-weight: bold; cursor: pointer; background: var(--blue); color: #000;
    }
    .progress-bg { background: #0f172a; border-radius: 8px; height: 10px; overflow: hidden; margin: 6px 0; }
    .progress-fill { background: var(--purple); height: 100%; width: 0%; transition: width 0.3s; }
    .tx-item, .sub-item {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid #334155; font-size: 13px;
    }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
      display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155;
    }
    .nav-btn { color: var(--muted); font-size: 11px; text-align: center; cursor: pointer; }
    .nav-btn.active { color: var(--blue); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- ВКЛАДКА 1: Главная -->
  <div id="tab-main" class="tab-content active">
    <div class="card">
      <div class="balance-lbl">Доступный Баланс</div>
      <div class="balance-val" id="balance">0 ₽</div>
      <div style="font-size: 12px; color: var(--green);" id="daily-limit">Лимит: ~0 ₽/день</div>
      <div class="stats-row">
        <span>Доходы: <b class="inc" id="income">+0 ₽</b></span>
        <span>Расходы: <b class="exp" id="expense">-0 ₽</b></span>
      </div>
    </div>

    <div class="card">
      <div class="balance-lbl" style="margin-bottom: 8px;">Быстрый расход / доход</div>
      <input type="number" id="quick-amount" placeholder="Сумма (₽)">
      <div class="btn-grid">
        <div class="cat-btn" onclick="addTx('expense', 'Еда')">🍔 Еда</div>
        <div class="cat-btn" onclick="addTx('expense', 'Такси')">🚕 Такси</div>
        <div class="cat-btn" onclick="addTx('expense', 'Кафе')">☕ Кафе</div>
        <div class="cat-btn" onclick="addTx('expense', 'Покупки')">🛍 Покупки</div>
        <div class="cat-btn" onclick="addTx('expense', 'Связь')">📱 Связь</div>
        <div class="cat-btn" onclick="addTx('income', 'Зарплата')">💵 Зарплата</div>
      </div>
    </div>

    <div class="card">
      <div class="balance-lbl" style="margin-bottom: 8px;">Последние операции</div>
      <div id="tx-list"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: Копилки -->
  <div id="tab-goals" class="tab-content">
    <div class="card">
      <div class="balance-lbl" style="margin-bottom: 8px;">Новая цель</div>
      <input type="text" id="goal-title" placeholder="Название (например, ПК)">
      <input type="number" id="goal-target" placeholder="Целевая сумма (₽)">
      <button class="main-btn" onclick="createGoal()">Создать цель</button>
    </div>

    <div class="card">
      <div class="balance-lbl" style="margin-bottom: 8px;">Мои Копилки</div>
      <div id="goals-list"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: Подписки -->
  <div id="tab-subs" class="tab-content">
    <div class="card">
      <div class="balance-lbl" style="margin-bottom: 8px;">Добавить подписку</div>
      <input type="text" id="sub-title" placeholder="Сервис (Telegram Premium)">
      <input type="number" id="sub-amount" placeholder="Стоимость в месяц (₽)">
      <input type="number" id="sub-day" placeholder="День списания (1-31)">
      <button class="main-btn" onclick="createSub()">Сохранить подписку</button>
    </div>

    <div class="card">
      <div class="balance-lbl">Всего на подписки: <b id="subs-total" style="color: var(--blue);">0 ₽</b></div>
      <div id="subs-list" style="margin-top: 10px;"></div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-btn active" onclick="switchTab('main', this)">🏠 Главная</div>
    <div class="nav-btn" onclick="switchTab('goals', this)">🎯 Копилки</div>
    <div class="nav-btn" onclick="switchTab('subs', this)">📅 Подписки</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Локальное состояние приложения
    let store = {
      transactions: [],
      goals: [],
      subscriptions: []
    };

    // --- ЧТЕНИЕ И ЗАПИСЬ В TELEGRAM CLOUD ---
    function saveData() {
      const jsonStr = JSON.stringify(store);
      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('finance_data', jsonStr);
      } else {
        localStorage.setItem('finance_data', jsonStr); // Запасной вариант для браузера
      }
      renderAll();
    }

    function loadData() {
      if (tg?.CloudStorage) {
        tg.CloudStorage.getItem('finance_data', (err, value) => {
          if (!err && value) store = JSON.parse(value);
          renderAll();
        });
      } else {
        const local = localStorage.getItem('finance_data');
        if (local) store = JSON.parse(local);
        renderAll();
      }
    }

    // --- ЛОГИКА И ОТРЕСОВКА ---
    function renderAll() {
      // Расчет сумм
      const inc = store.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const exp = store.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const inGoals = store.goals.reduce((s, g) => s + g.current, 0);
      const balance = inc - exp - inGoals;

      // Дневной лимит
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = Math.max(1, daysInMonth - now.getDate() + 1);
      const dailyLimit = balance > 0 ? Math.round(balance / daysLeft) : 0;

      document.getElementById('balance').innerText = `${balance.toLocaleString()} ₽`;
      document.getElementById('income').innerText = `+${inc.toLocaleString()} ₽`;
      document.getElementById('expense').innerText = `-${exp.toLocaleString()} ₽`;
      document.getElementById('daily-limit').innerText = `Лимит: ~${dailyLimit.toLocaleString()} ₽/день (осталось ${daysLeft} дн.)`;

      // Список операций
      const txList = document.getElementById('tx-list');
      txList.innerHTML = store.transactions.slice(-10).reverse().map(t => `
        <div class="tx-item">
          <span><b>${t.category}</b></span>
          <span class="${t.type === 'income' ? 'inc' : 'exp'}">
            ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} ₽
          </span>
        </div>
      `).join('');

      // Список копилок
      document.getElementById('goals-list').innerHTML = store.goals.map((g, idx) => {
        const percent = Math.min(100, Math.round((g.current / g.target) * 100));
        return `
          <div style="margin-bottom: 12px;">
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <b>${g.title}</b>
              <span>${g.current.toLocaleString()} / ${g.target.toLocaleString()} ₽</span>
            </div>
            <div class="progress-bg"><div class="progress-fill" style="width: ${percent}%;"></div></div>
            <button onclick="topupGoal(${idx})" style="padding:4px 8px; font-size:11px; background:#334155; color:#fff; border:none; border-radius:6px; cursor:pointer;">+ 1 000 ₽</button>
          </div>
        `;
      }).join('');

      // Подписки
      const subTotal = store.subscriptions.reduce((s, sub) => s + sub.amount, 0);
      document.getElementById('subs-total').innerText = `${subTotal.toLocaleString()} ₽`;
      document.getElementById('subs-list').innerHTML = store.subscriptions.map(s => `
        <div class="sub-item">
          <span><b>${s.title}</b> (${s.day}-е число)</span>
          <span style="color: var(--blue);">${s.amount.toLocaleString()} ₽</span>
        </div>
      `).join('');
    }

    // --- ДЕЙСТВИЯ ---
    function addTx(type, category) {
      const amt = parseFloat(document.getElementById('quick-amount').value);
      if (!amt || amt <= 0) return alert("Введи сумму!");

      store.transactions.push({ type, category, amount: amt, date: new Date().toISOString() });
      document.getElementById('quick-amount').value = '';
      saveData();
    }

    function createGoal() {
      const title = document.getElementById('goal-title').value;
      const target = parseFloat(document.getElementById('goal-target').value);
      if (!title || !target) return alert("Заполни поля!");

      store.goals.push({ title, target, current: 0 });
      document.getElementById('goal-title').value = '';
      document.getElementById('goal-target').value = '';
      saveData();
    }

    function topupGoal(idx) {
      store.goals[idx].current += 1000;
      saveData();
    }

    function createSub() {
      const title = document.getElementById('sub-title').value;
      const amount = parseFloat(document.getElementById('sub-amount').value);
      const day = parseInt(document.getElementById('sub-day').value);
      if (!title || !amount || !day) return alert("Заполни поля!");

      store.subscriptions.push({ title, amount, day });
      document.getElementById('sub-title').value = '';
      document.getElementById('sub-amount').value = '';
      document.getElementById('sub-day').value = '';
      saveData();
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      btn.classList.add('active');
    }

    loadData();
  </script>
</body>
</html>
